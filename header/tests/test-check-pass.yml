name: Test license-eye check mode (passing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: check
        uses: .
        with:
          config: tests/fixtures/licensed/.licenserc.yaml
          mode: check
          log: info
          token: ""

      - name: Assert check passed
        run: |
          echo "PASS: license-eye check completed successfully"

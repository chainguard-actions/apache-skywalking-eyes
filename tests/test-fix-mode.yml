name: Test fix mode - adds license headers to files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create unlicensed test file and config for fix mode
        run: |
          mkdir -p tests/fixtures/tofix
          printf 'package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("This file needs a license header!")\n}\n' > tests/fixtures/tofix/fixme.go

          echo "File content before fix:"
          cat tests/fixtures/tofix/fixme.go

          printf 'header:\n  license:\n    spdx-id: Apache-2.0\n    copyright-owner: Test Owner\n  paths:\n    - "tests/fixtures/tofix/**"\n' > /tmp/test-licenserc-fix.yaml

      - id: action
        uses: .
        with:
          config: /tmp/test-licenserc-fix.yaml
          mode: fix
          log: info

      - name: Assert fix mode added license header
        run: |
          echo "File content after fix:"
          cat tests/fixtures/tofix/fixme.go

          # Check that the license header was added (Apache-2.0 SPDX comment or license text)
          if grep -qiE "Apache|Licensed|SPDX" tests/fixtures/tofix/fixme.go; then
            echo "PASS: license header was added to the file"
          else
            echo "FAIL: license header was not added to the file"
            exit 1
          fi

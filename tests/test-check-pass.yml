name: Test check mode - all files have license headers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write licenserc config for licensed files
        run: |
          printf 'header:\n  license:\n    spdx-id: Apache-2.0\n    copyright-owner: Apache Software Foundation\n  paths:\n    - "tests/fixtures/licensed/**"\n' > /tmp/test-licenserc-pass.yaml

      - id: action
        uses: .
        with:
          config: /tmp/test-licenserc-pass.yaml
          mode: check
          log: info

      - name: Assert check passed
        run: |
          echo "PASS: action completed successfully - all files have proper license headers"
